schema_version: 1
controls:
  - {id: ict_ctl_01, proposal_id: ict_lifecycle_traceability, control_type: governance, title_en: Authoritative-system ownership, title_lv: Autoritatīvās sistēmas īpašumtiesības, requirement_en: Every evidence reference identifies the authoritative system and accountable owner., requirement_lv: Katra pierādījuma atsauce identificē autoritatīvo sistēmu un atbildīgo īpašnieku., verification_en: Sample references and confirm owner system and access path., verification_lv: Izlases kārtā pārbaudīt īpašnieku sistēmu un piekļuves ceļu.}
  - {id: ict_ctl_02, proposal_id: ict_lifecycle_traceability, control_type: evidence, title_en: Minimal evidence pointer, title_lv: Minimāla pierādījuma norāde, requirement_en: Store identifiers integrity data status and controlled references rather than sensitive artefact copies., requirement_lv: Glabāt identifikatorus integritātes datus statusu un kontrolētas atsauces nevis sensitīvu artefaktu kopijas., verification_en: Inspect fields and validate authorised reference resolution., verification_lv: Pārbaudīt laukus un validēt pilnvarotu atsauču atrisināšanu.}
  - {id: ict_ctl_03, proposal_id: ict_lifecycle_traceability, control_type: evidence, title_en: Change-to-release linkage, title_lv: Izmaiņas un laidiena sasaiste, requirement_en: Production changes trace to approved change and deployed release identities., requirement_lv: Produkcijas izmaiņas ir izsekojamas līdz apstiprinātai izmaiņai un izvietotā laidiena identitātei., verification_en: Trace a production-change sample end to end., verification_lv: Izsekot produkcijas izmaiņu izlasi no sākuma līdz beigām.}
  - {id: ict_ctl_04, proposal_id: ict_lifecycle_traceability, control_type: operational, title_en: Emergency-change accountability, title_lv: Ārkārtas izmaiņu atbildība, requirement_en: Emergency changes record approver reason rollback evidence and reconciliation., requirement_lv: Ārkārtas izmaiņas reģistrē apstiprinātāju pamatojumu rollback pierādījumu un saskaņošanu., verification_en: Inspect emergency-change and reconciliation records., verification_lv: Pārbaudīt ārkārtas izmaiņu un saskaņošanas ierakstus.}
  - {id: cvd_ctl_01, proposal_id: latvia_cvd_authorization, control_type: governance, title_en: Explicit programme scope, title_lv: Skaidrs programmas tvērums, requirement_en: Programme terms identify authorised resources and material exclusions unambiguously., requirement_lv: Programmas noteikumi nepārprotami identificē atļautos resursus un būtiskos izņēmumus., verification_en: Compare programme scope with the owner inventory., verification_lv: Salīdzināt programmas tvērumu ar pārziņa inventarizāciju.}
  - {id: cvd_ctl_02, proposal_id: latvia_cvd_authorization, control_type: safety, title_en: Stop conditions and minimisation, title_lv: Apstāšanās nosacījumi un minimizācija, requirement_en: Terms define stop conditions and prohibit unnecessary access extraction modification or disruption., requirement_lv: Noteikumi definē apstāšanās nosacījumus un aizliedz nevajadzīgu piekļuvi izgūšanu pārveidošanu vai traucēšanu., verification_en: Review terms and tabletop sensitive-data exposure., verification_lv: Pārskatīt noteikumus un izspēlēt sensitīvu datu scenāriju.}
  - {id: cvd_ctl_03, proposal_id: latvia_cvd_authorization, control_type: governance, title_en: Third-party authority boundary, title_lv: Trešo pušu pilnvarojuma robeža, requirement_en: Programme language does not purport to authorise systems outside issuer control or authority., requirement_lv: Programmas teksts nepiešķir šķietamu atļauju sistēmām ārpus izdevēja kontroles vai pilnvarojuma., verification_en: Map dependencies and confirm exclusions or authority., verification_lv: Kartēt atkarības un apstiprināt izņēmumus vai pilnvarojumu.}
  - {id: cvd_ctl_04, proposal_id: latvia_cvd_authorization, control_type: evidence, title_en: Report-state evidence, title_lv: Ziņojuma stāvokļa pierādījumi, requirement_en: Reports record receipt triage validation remediation communication and closure timestamps., requirement_lv: Ziņojumi reģistrē saņemšanas triāžas validācijas novēršanas komunikācijas un slēgšanas laiku., verification_en: Reconstruct sampled report timelines., verification_lv: Rekonstruēt atlasītu ziņojumu laika līnijas.}
  - {id: vuln_ctl_01, proposal_id: defensible_vulnerability_prioritisation, control_type: evidence, title_en: Signal provenance, title_lv: Signālu izcelsme, requirement_en: Every prioritisation record identifies source version or observation time for each signal., requirement_lv: Katrs prioritizācijas ieraksts identificē katra signāla avotu versiju vai novērojuma laiku., verification_en: Recompute a sample from recorded inputs., verification_lv: Pārrēķināt izlasi no reģistrētajiem ievaddatiem.}
  - {id: vuln_ctl_02, proposal_id: defensible_vulnerability_prioritisation, control_type: governance, title_en: No universal score, title_lv: Bez universāla riska skaitļa, requirement_en: Severity likelihood known exploitation asset criticality and obligations remain separately visible., requirement_lv: Smagums varbūtība zināma ekspluatācija aktīva kritiskums un pienākumi paliek atsevišķi redzami., verification_en: Inspect for hidden weighting or collapsed meaning., verification_lv: Pārbaudīt uz slēptiem svariem vai jēdzienu sapludināšanu.}
  - {id: vuln_ctl_03, proposal_id: defensible_vulnerability_prioritisation, control_type: evidence, title_en: Asset and exposure context, title_lv: Aktīva un ekspozīcijas konteksts, requirement_en: Decisions include asset criticality exposure compensating controls and operational constraints., requirement_lv: Lēmumi ietver aktīva kritiskumu ekspozīciju kompensējošās kontroles un operacionālos ierobežojumus., verification_en: Compare decisions across asset classes., verification_lv: Salīdzināt lēmumus dažādās aktīvu klasēs.}
  - {id: vuln_ctl_04, proposal_id: defensible_vulnerability_prioritisation, control_type: governance, title_en: Explainable override, title_lv: Izskaidrojams izņēmuma lēmums, requirement_en: Overrides record owner rationale evidence and expiry or review condition., requirement_lv: Izņēmumi reģistrē īpašnieku pamatojumu pierādījumus un beigu vai pārskatīšanas nosacījumu., verification_en: Review override completeness and staleness., verification_lv: Pārbaudīt izņēmumu pilnīgumu un novecošanu.}
  - {id: deg_ctl_01, proposal_id: degraded_operations_framework, control_type: governance, title_en: Declared operational states, title_lv: Definēti darbības stāvokļi, requirement_en: Define normal degraded offline or manual and recovery or reconciliation states with criteria., requirement_lv: Definēt normālu degradētu bezsaistes vai manuālu un atjaunošanas vai saskaņošanas stāvokli ar kritērijiem., verification_en: Review state definitions and exercise transitions., verification_lv: Pārskatīt stāvokļus un vingrināt pārejas.}
  - {id: deg_ctl_02, proposal_id: degraded_operations_framework, control_type: evidence, title_en: Authoritative-record declaration, title_lv: Autoritatīvā ieraksta deklarācija, requirement_en: Identify which record remains authoritative when supporting systems fail., requirement_lv: Noteikt kurš ieraksts paliek autoritatīvs atbalsta sistēmu atteices laikā., verification_en: Simulate outage and verify authority does not silently shift., verification_lv: Izspēlēt atteici un pārbaudīt ka autoritāte klusējot nemainās.}
  - {id: deg_ctl_03, proposal_id: degraded_operations_framework, control_type: operational, title_en: Tested fallback, title_lv: Praktiski pārbaudīts fallback, requirement_en: Exercise a documented fallback under realistic dependency loss., requirement_lv: Praktiski pārbaudīt dokumentētu fallback reālistiskā atkarību zudumā., verification_en: Observe timing hand-offs and unresolved dependencies., verification_lv: Pārbaudīt laiku lomu nodošanu un neatrisinātās atkarības.}
  - {id: deg_ctl_04, proposal_id: degraded_operations_framework, control_type: operational, title_en: Recovery reconciliation, title_lv: Atjaunošanas saskaņošana, requirement_en: Reconcile manual queued and automated records and handle conflicts explicitly., requirement_lv: Saskaņot manuālos rindā esošos un automatizētos ierakstus un skaidri apstrādāt konfliktus., verification_en: Exercise recovery and account for every test record., verification_lv: Izspēlēt atjaunošanu un uzskaitīt katru testa ierakstu.}
