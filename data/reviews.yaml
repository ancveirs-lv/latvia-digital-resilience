schema_version: 1
reviews:
  - {id: ict_legal_regulatory, proposal_id: ict_lifecycle_traceability, lens: legal_regulatory, disposition: pilot_condition, objection_en: "The evidence profile could be mistaken for a statutory reporting requirement.", objection_lv: "Pierādījumu profilu var kļūdaini uztvert kā normatīvu ziņošanas pienākumu.", recommendation_en: "Keep it explicitly non-normative and require institution-specific legal mapping before adoption.", recommendation_lv: "Saglabāt to skaidri nenormatīvu un pirms ieviešanas prasīt institūcijai specifisku juridisko kartējumu."}
  - {id: ict_system_owner, proposal_id: ict_lifecycle_traceability, lens: system_owner, disposition: pilot_condition, objection_en: "The model could duplicate authoritative data already held in VIRSIS or local systems.", objection_lv: "Modelis var dublēt autoritatīvus datus, kas jau atrodas VIRSIS vai lokālajās sistēmās.", recommendation_en: "Measure duplicate fields and manual hand-offs and reject unnecessary replication.", recommendation_lv: "Mērīt dublētos laukus un manuālās nodošanas un atteikties no nevajadzīgas replikācijas."}
  - {id: ict_architecture, proposal_id: ict_lifecycle_traceability, lens: architecture, disposition: mitigated, objection_en: "A central evidence warehouse would increase coupling concentration risk and access complexity.", objection_lv: "Centrāla pierādījumu glabātuve palielinātu sasaisti koncentrācijas risku un piekļuves sarežģītību.", recommendation_en: "Keep sensitive artefacts in authoritative systems and use minimal controlled references.", recommendation_lv: "Sensitīvos artefaktus atstāt autoritatīvajās sistēmās un lietot minimālas kontrolētas atsauces."}
  - {id: ict_soc_csirt, proposal_id: ict_lifecycle_traceability, lens: soc_csirt, disposition: pilot_condition, objection_en: "Full evidence capture could slow emergency change and incident response.", objection_lv: "Pilna pierādījumu fiksēšana var palēnināt ārkārtas izmaiņas un incidentu reaģēšanu.", recommendation_en: "Allow an emergency path with mandatory post-change reconciliation and measure its latency.", recommendation_lv: "Atļaut ārkārtas ceļu ar obligātu pēcapstrādes saskaņošanu un mērīt tā aizkavi."}
  - {id: ict_security_researcher, proposal_id: ict_lifecycle_traceability, lens: security_researcher, disposition: mitigated, objection_en: "Traceability metadata could expose sensitive internal relationships and component identities.", objection_lv: "Izsekojamības metadati var atklāt sensitīvas iekšējās saites un komponentu identitātes.", recommendation_en: "Separate restricted internal traceability from minimal public assurance.", recommendation_lv: "Nošķirt ierobežotu iekšējo izsekojamību no minimāla publiska assurance."}
  - {id: ict_privacy_dpo, proposal_id: ict_lifecycle_traceability, lens: privacy_dpo, disposition: pilot_condition, objection_en: "Evidence references may over-collect personal data about operators or approvers.", objection_lv: "Pierādījumu atsauces var pārmērīgi vākt personas datus par operatoriem vai apstiprinātājiem.", recommendation_en: "Prefer role identifiers where sufficient define retention and complete privacy review before production.", recommendation_lv: "Ja pietiek izmantot lomu identifikatorus noteikt glabāšanu un pirms produkcijas veikt privātuma pārbaudi."}
  - {id: ict_procurement_finance, proposal_id: ict_lifecycle_traceability, lens: procurement_finance, disposition: pilot_condition, objection_en: "A new platform could be procured before the gap and ownership cost are measured.", objection_lv: "Jaunu platformu var iepirkt pirms trūkuma un īpašumizmaksu izmērīšanas.", recommendation_en: "Pilot with existing tools first and record integration manual effort and ownership cost.", recommendation_lv: "Vispirms pilotēt ar esošajiem rīkiem un uzskaitīt integrācijas manuālo darbu un īpašumizmaksas."}
  - {id: ict_municipal_civil_protection, proposal_id: ict_lifecycle_traceability, lens: municipal_civil_protection, disposition: pilot_condition, objection_en: "Small institutions may lack staff and tooling for a detailed evidence chain.", objection_lv: "Mazām institūcijām var trūkt personāla un rīku detalizētas pierādījumu ķēdes uzturēšanai.", recommendation_en: "Define a minimum viable profile and test administrative burden before scaling.", recommendation_lv: "Definēt minimālo dzīvotspējīgo profilu un pirms mērogošanas pārbaudīt administratīvo slogu."}
  - {id: ict_election_process_owner, proposal_id: ict_lifecycle_traceability, lens: election_process_owner, disposition: mitigated, objection_en: "Detailed lifecycle evidence for election systems can itself become sensitive operational information.", objection_lv: "Detalizēti vēlēšanu sistēmu dzīves cikla pierādījumi paši var kļūt par sensitīvu operacionālo informāciju.", recommendation_en: "Keep operational evidence restricted and publish only bounded non-sensitive assurance.", recommendation_lv: "Operacionālos pierādījumus ierobežot un publiskot tikai ierobežotu nesensitīvu assurance."}
  - {id: ict_independent_auditor_public, proposal_id: ict_lifecycle_traceability, lens: independent_auditor_public, disposition: pilot_condition, objection_en: "A dashboard could create an appearance of completeness without proving it.", objection_lv: "Dashboard var radīt pilnīguma iespaidu to faktiski nepierādot.", recommendation_en: "Predeclare completeness metrics and expose missing or unresolved evidence as exceptions.", recommendation_lv: "Iepriekš definēt pilnīguma metriku un trūkstošus vai neatrisinātus pierādījumus rādīt kā izņēmumus."}

  - {id: cvd_legal_regulatory, proposal_id: latvia_cvd_authorization, lens: legal_regulatory, disposition: pilot_condition, objection_en: "Programme wording could imply broader legal immunity or testing authority than the owner can grant.", objection_lv: "Programmas teksts var radīt plašākas juridiskas imunitātes vai testēšanas pilnvarojuma iespaidu nekā pārzinis var piešķirt.", recommendation_en: "Require legal review and state the authority boundary explicitly.", recommendation_lv: "Prasīt juridisku pārbaudi un skaidri norādīt pilnvarojuma robežu."}
  - {id: cvd_system_owner, proposal_id: latvia_cvd_authorization, lens: system_owner, disposition: pilot_condition, objection_en: "Published scope can drift from the current asset inventory and ownership model.", objection_lv: "Publicētais tvērums var novirzīties no aktuālās aktīvu inventarizācijas un īpašumtiesību modeļa.", recommendation_en: "Reconcile programme scope with the authoritative inventory at launch and after material change.", recommendation_lv: "Palaišanas brīdī un pēc būtiskām izmaiņām saskaņot tvērumu ar autoritatīvo inventarizāciju."}
  - {id: cvd_architecture, proposal_id: latvia_cvd_authorization, lens: architecture, disposition: mitigated, objection_en: "Hostnames alone may hide shared infrastructure tenant boundaries or third-party dependencies.", objection_lv: "Hostname vien var slēpt koplietotu infrastruktūru tenant robežas vai trešo pušu atkarības.", recommendation_en: "Maintain an internal dependency map and publish exclusions where authority is ambiguous.", recommendation_lv: "Uzturēt iekšēju atkarību karti un publicēt izņēmumus ja pilnvarojums nav skaidrs."}
  - {id: cvd_soc_csirt, proposal_id: latvia_cvd_authorization, lens: soc_csirt, disposition: pilot_condition, objection_en: "Report volume can exceed triage and remediation capacity.", objection_lv: "Ziņojumu apjoms var pārsniegt triāžas un novēršanas kapacitāti.", recommendation_en: "Name triage and remediation owners and measure backlog and hand-off latency.", recommendation_lv: "Nosaukt triāžas un novēršanas īpašniekus un mērīt backlog un nodošanas aizkavi."}
  - {id: cvd_security_researcher, proposal_id: latvia_cvd_authorization, lens: security_researcher, disposition: pilot_condition, objection_en: "Ambiguous proof requirements or stop conditions increase risk for good-faith researchers.", objection_lv: "Neskaidras pierādījuma prasības vai apstāšanās nosacījumi palielina risku labticīgiem pētniekiem.", recommendation_en: "Publish permitted proof prohibited actions stop conditions and a scope-clarification route.", recommendation_lv: "Publicēt atļauto pierādījumu aizliegtās darbības apstāšanās nosacījumus un tvēruma precizēšanas ceļu."}
  - {id: cvd_privacy_dpo, proposal_id: latvia_cvd_authorization, lens: privacy_dpo, disposition: pilot_condition, objection_en: "Vulnerability validation may expose personal or other sensitive data.", objection_lv: "Ievainojamības validācija var atklāt personas vai citus sensitīvus datus.", recommendation_en: "Define minimum proof accidental-data handling retention ownership and escalation.", recommendation_lv: "Definēt minimālo pierādījumu nejauši iegūtu datu apstrādi glabāšanas īpašnieku un eskalāciju."}
  - {id: cvd_procurement_finance, proposal_id: latvia_cvd_authorization, lens: procurement_finance, disposition: mitigated, objection_en: "CVD can be conflated with a paid Bug Bounty or contracted penetration test.", objection_lv: "CVD var tikt sajaukts ar apmaksātu Bug Bounty vai līgumisku penetrācijas testu.", recommendation_en: "Cost and govern disclosure handling rewards and contracted assurance separately.", recommendation_lv: "Atsevišķi izmaksāt un pārvaldīt ziņojumu apstrādi atlīdzības un līgumisku assurance."}
  - {id: cvd_municipal_civil_protection, proposal_id: latvia_cvd_authorization, lens: municipal_civil_protection, disposition: pilot_condition, objection_en: "Smaller public bodies may lack continuous specialist triage capacity.", objection_lv: "Mazākām publiskām institūcijām var nebūt nepārtrauktas specializētas triāžas kapacitātes.", recommendation_en: "Define escalation and ownership paths that remain workable with limited local staffing.", recommendation_lv: "Definēt eskalācijas un atbildības ceļus kas darbojas arī ar ierobežotu lokālo personālu."}
  - {id: cvd_election_process_owner, proposal_id: latvia_cvd_authorization, lens: election_process_owner, disposition: pilot_condition, objection_en: "Testing during sensitive election periods can create availability confidentiality or perception risks.", objection_lv: "Testēšana sensitīvos vēlēšanu periodos var radīt pieejamības konfidencialitātes vai uztveres riskus.", recommendation_en: "Use explicit exclusions or time-bound constraints where operational risk cannot be controlled safely.", recommendation_lv: "Lietot skaidrus izņēmumus vai laika ierobežojumus ja operacionālo risku nevar droši kontrolēt."}
  - {id: cvd_independent_auditor_public, proposal_id: latvia_cvd_authorization, lens: independent_auditor_public, disposition: pilot_condition, objection_en: "A published programme can look mature while reports silently stall or close without evidence.", objection_lv: "Publicēta programma var izskatīties nobriedusi kamēr ziņojumi klusējot iestrēgst vai tiek slēgti bez pierādījumiem.", recommendation_en: "Preserve report-state timestamps and use non-sensitive aggregate service evidence where appropriate.", recommendation_lv: "Saglabāt ziņojumu stāvokļu laika zīmogus un kur piemēroti lietot nesensitīvus agregētus pakalpojuma pierādījumus."}

  - {id: vuln_legal_regulatory, proposal_id: defensible_vulnerability_prioritisation, lens: legal_regulatory, disposition: mitigated, objection_en: "Technical ranking could be used to defer work required by law contract or regulator.", objection_lv: "Tehnisku prioritāti var izmantot lai atliktu darbu ko prasa likums līgums vai regulators.", recommendation_en: "Record mandatory deadlines separately and prohibit the model from overriding them.", recommendation_lv: "Obligātos termiņus reģistrēt atsevišķi un aizliegt modelim tos pārrakstīt."}
  - {id: vuln_system_owner, proposal_id: defensible_vulnerability_prioritisation, lens: system_owner, disposition: pilot_condition, objection_en: "Stale or missing asset context can make decisions look more precise than the inventory allows.", objection_lv: "Novecojis vai trūkstošs aktīva konteksts var radīt lielāku precizitātes iespaidu nekā inventarizācija ļauj.", recommendation_en: "Surface unknown or stale context explicitly and route it for inventory correction.", recommendation_lv: "Skaidri rādīt nezināmu vai novecojušu kontekstu un novirzīt to inventarizācijas labošanai."}
  - {id: vuln_architecture, proposal_id: defensible_vulnerability_prioritisation, lens: architecture, disposition: pilot_condition, objection_en: "The same CVE can have materially different consequences across architectures.", objection_lv: "Vienai un tai pašai CVE dažādās arhitektūrās var būt būtiski atšķirīgas sekas.", recommendation_en: "Require reachability trust-boundary asset-role and compensating-control context before action classification.", recommendation_lv: "Pirms darbības klases prasīt sasniedzamības trust-boundary aktīva lomas un kompensējošo kontroļu kontekstu."}
  - {id: vuln_soc_csirt, proposal_id: defensible_vulnerability_prioritisation, lens: soc_csirt, disposition: mitigated, objection_en: "Complex analytical scoring can slow response during active exploitation.", objection_lv: "Sarežģīta analītiska vērtēšana var palēnināt reakciju aktīvas ekspluatācijas laikā.", recommendation_en: "Maintain a fast operational escalation path separate from analytical enrichment.", recommendation_lv: "Uzturēt ātras operacionālas eskalācijas ceļu atsevišķi no analītiskās bagātināšanas."}
  - {id: vuln_security_researcher, proposal_id: defensible_vulnerability_prioritisation, lens: security_researcher, disposition: mitigated, objection_en: "Missing KEV evidence or low EPSS can be misread as evidence of safety.", objection_lv: "Neesamību KEV vai zemu EPSS var kļūdaini uztvert kā drošuma pierādījumu.", recommendation_en: "Preserve unknown states and prohibit safety conclusions from missing catalogue evidence.", recommendation_lv: "Saglabāt nezināma stāvokļus un aizliegt drošuma secinājumus no trūkstošiem kataloga pierādījumiem."}
  - {id: vuln_privacy_dpo, proposal_id: defensible_vulnerability_prioritisation, lens: privacy_dpo, disposition: mitigated, objection_en: "Asset context can reveal personal data or sensitive organisational relationships.", objection_lv: "Aktīva konteksts var atklāt personas datus vai sensitīvas organizatoriskas saites.", recommendation_en: "Minimise identity data and control access to sensitive asset and impact context.", recommendation_lv: "Minimizēt identitātes datus un kontrolēt piekļuvi sensitīvam aktīvu un ietekmes kontekstam."}
  - {id: vuln_procurement_finance, proposal_id: defensible_vulnerability_prioritisation, lens: procurement_finance, disposition: pilot_condition, objection_en: "Proprietary scores can obscure assumptions and create vendor lock-in.", objection_lv: "Proprietary score var slēpt pieņēmumus un radīt vendor lock-in.", recommendation_en: "Require exportable inputs documented logic and independent recomputation in procurement criteria.", recommendation_lv: "Iepirkuma kritērijos prasīt eksportējamus ievaddatus dokumentētu loģiku un neatkarīgu pārrēķinu."}
  - {id: vuln_municipal_civil_protection, proposal_id: defensible_vulnerability_prioritisation, lens: municipal_civil_protection, disposition: pilot_condition, objection_en: "Small organisations may not have enough context to maintain a sophisticated multi-signal model.", objection_lv: "Mazām organizācijām var nepietikt konteksta sarežģīta vairāku signālu modeļa uzturēšanai.", recommendation_en: "Define a minimum decision record with visible uncertainty and optional enrichment.", recommendation_lv: "Definēt minimālu lēmuma ierakstu ar redzamu nenoteiktību un izvēles bagātināšanu."}
  - {id: vuln_election_process_owner, proposal_id: defensible_vulnerability_prioritisation, lens: election_process_owner, disposition: pilot_condition, objection_en: "Remediation urgency can conflict with change freezes and availability requirements around critical events.", objection_lv: "Novēršanas steidzamība var konfliktēt ar change freeze un pieejamības prasībām kritisku notikumu laikā.", recommendation_en: "Treat priority and deployment timing as separate decisions with explicit risk ownership for deferral.", recommendation_lv: "Prioritāti un izvietošanas laiku turēt kā atsevišķus lēmumus ar skaidru riska īpašnieku atlikšanai."}
  - {id: vuln_independent_auditor_public, proposal_id: defensible_vulnerability_prioritisation, lens: independent_auditor_public, disposition: pilot_condition, objection_en: "A model can be tuned until it reproduces desired decisions and then presented as objective.", objection_lv: "Modeli var pielāgot līdz tas reproducē vēlamus lēmumus un pēc tam pasniegt kā objektīvu.", recommendation_en: "Evaluate historical cases with time-frozen inputs and preserve override history.", recommendation_lv: "Vēsturiskos gadījumus vērtēt ar laikā fiksētiem ievaddatiem un saglabāt izņēmumu vēsturi."}

  - {id: deg_legal_regulatory, proposal_id: degraded_operations_framework, lens: legal_regulatory, disposition: mitigated, objection_en: "The project state model could be mistaken for an official continuity taxonomy or sector requirement.", objection_lv: "Projekta stāvokļu modeli var kļūdaini uztvert kā oficiālu nepārtrauktības taksonomiju vai nozares prasību.", recommendation_en: "Keep the model explicitly project-defined and map it to sector obligations before use.", recommendation_lv: "Saglabāt modeli skaidri kā projekta veidotu un pirms lietošanas kartēt pret nozares pienākumiem."}
  - {id: deg_system_owner, proposal_id: degraded_operations_framework, lens: system_owner, disposition: pilot_condition, objection_en: "Entry and exit criteria may be vague leaving operators unsure when to switch modes.", objection_lv: "Ieejas un izejas kritēriji var būt neskaidri atstājot operatoriem nesaprotamu režīma maiņas brīdi.", recommendation_en: "Predeclare observable triggers and decision ownership for every transition.", recommendation_lv: "Iepriekš definēt novērojamus trigerus un lēmuma īpašnieku katrai pārejai."}
  - {id: deg_architecture, proposal_id: degraded_operations_framework, lens: architecture, disposition: pilot_condition, objection_en: "Fallback can share hidden dependencies with the primary path and fail at the same time.", objection_lv: "Fallback var koplietot slēptas atkarības ar primāro ceļu un atteikt vienlaikus.", recommendation_en: "Exercise selected dependency losses and record shared dependencies discovered by the test.", recommendation_lv: "Vingrināt izvēlētu atkarību zudumu un reģistrēt testā atklātās kopīgās atkarības."}
  - {id: deg_soc_csirt, proposal_id: degraded_operations_framework, lens: soc_csirt, disposition: mitigated, objection_en: "Security containment actions may conflict with service-continuity objectives.", objection_lv: "Drošības containment darbības var konfliktēt ar pakalpojuma nepārtrauktības mērķiem.", recommendation_en: "Include security-driven transition triggers and predeclared escalation authority in exercises.", recommendation_lv: "Vingrinājumos iekļaut drošības izraisītus pārejas trigerus un iepriekš noteiktu eskalācijas pilnvarojumu."}
  - {id: deg_security_researcher, proposal_id: degraded_operations_framework, lens: security_researcher, disposition: mitigated, objection_en: "Public fallback and recovery details can reveal valuable dependency information.", objection_lv: "Publiskas fallback un recovery detaļas var atklāt vērtīgu informāciju par atkarībām.", recommendation_en: "Separate public assurance evidence from restricted exercise and recovery detail.", recommendation_lv: "Nošķirt publisko assurance pierādījumu no ierobežotas vingrinājumu un recovery informācijas."}
  - {id: deg_privacy_dpo, proposal_id: degraded_operations_framework, lens: privacy_dpo, disposition: pilot_condition, objection_en: "Manual fallback can introduce uncontrolled paper local files or ad-hoc personal-data handling.", objection_lv: "Manuāls fallback var ieviest nekontrolētu papīra lokālu failu vai ad-hoc personas datu apstrādi.", recommendation_en: "Define minimum data custody retention and secure import or destruction for manual records.", recommendation_lv: "Manuālajiem ierakstiem definēt minimālos datus custody glabāšanu un drošu importu vai iznīcināšanu."}
  - {id: deg_procurement_finance, proposal_id: degraded_operations_framework, lens: procurement_finance, disposition: pilot_condition, objection_en: "Resilience spending can grow before benefits are demonstrated by exercise evidence.", objection_lv: "Noturības izmaksas var augt pirms ieguvums ir pierādīts ar vingrinājumu rezultātiem.", recommendation_en: "Cost pilot findings and prioritise tested procedure and dependency fixes before new platforms.", recommendation_lv: "Izmaksāt pilota atradumus un pirms jaunām platformām prioritizēt pārbaudītas procedūras un atkarību uzlabojumus."}
  - {id: deg_municipal_civil_protection, proposal_id: degraded_operations_framework, lens: municipal_civil_protection, disposition: pilot_condition, objection_en: "A fallback may assume staff connectivity or specialist roles unavailable in a real crisis.", objection_lv: "Fallback var pieņemt personālu sakarus vai speciālistu lomas kas reālā krīzē nav pieejamas.", recommendation_en: "Include staff absence and communications loss in at least one exercise scenario.", recommendation_lv: "Vismaz vienā vingrinājuma scenārijā iekļaut personāla nepieejamību un sakaru zudumu."}
  - {id: deg_election_process_owner, proposal_id: degraded_operations_framework, lens: election_process_owner, disposition: pilot_condition, objection_en: "Degraded or manual operation can create ambiguity about which election record remains authoritative.", objection_lv: "Degradēta vai manuāla darbība var radīt neskaidrību par to kurš vēlēšanu ieraksts paliek autoritatīvs.", recommendation_en: "Exercise authority preservation and reconciliation without publishing sensitive mechanics.", recommendation_lv: "Vingrināt autoritātes saglabāšanu un saskaņošanu nepublicējot sensitīvo mehāniku."}
  - {id: deg_independent_auditor_public, proposal_id: degraded_operations_framework, lens: independent_auditor_public, disposition: pilot_condition, objection_en: "An exercise can be declared successful while exceptions or unreconciled records are omitted.", objection_lv: "Vingrinājumu var pasludināt par veiksmīgu pat ja izņēmumi vai nesaskaņotie ieraksti netiek uzrādīti.", recommendation_en: "Predeclare failure conditions and require reconciliation evidence for every test record.", recommendation_lv: "Iepriekš definēt neveiksmes nosacījumus un prasīt saskaņošanas pierādījumu katram testa ierakstam."}
